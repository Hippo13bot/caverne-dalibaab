<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#171a1d">
<title>Identification du matériel — La Caverne d’Alibaab</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#171a1d;color:#f4f4f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:#22282d;border:1px solid #3a4248;border-radius:18px;padding:24px;box-shadow:0 16px 50px #0005}.brand{font-size:11px;letter-spacing:2px;color:#e7a72d;font-weight:800}.eyebrow{font-size:11px;color:#aeb7bd;margin:24px 0 7px;text-transform:uppercase;letter-spacing:1px}.tag{font-size:26px;color:#e7a72d;font-weight:900;overflow-wrap:anywhere}.item{font-size:22px;margin:8px 0}.muted{color:#aeb7bd;font-size:13px;line-height:1.5}.owner{border-top:1px solid #3a4248;margin-top:22px;padding-top:18px}.owner h2{font-size:17px;margin:5px 0}.contact{display:grid;gap:10px;margin-top:15px}.contact a{display:block;text-decoration:none;color:#171a1d;background:#e7a72d;padding:13px 15px;border-radius:10px;font-weight:800;text-align:center}.contact a.secondary{background:#343d43;color:#fff}.error{color:#ffc0b4}.footer{font-size:10px;color:#849097;margin-top:22px;text-align:center}
</style>
</head>
<body><main class="card"><div class="brand">LA CAVERNE D’ALIBAAB</div><div id="content"><p class="muted">Chargement de la fiche…</p></div><div class="footer">Fiche publique d’identification du matériel</div></main>
<script src="public-config.js"></script>
<script>
(()=>{
  const q=new URLSearchParams(location.search),short=q.get('i'),id=q.get('id');
  const cfg=window.CAVERNE_PUBLIC_CONFIG||{};
  const project=(q.get('project')||cfg.supabaseUrl||'').replace(/\/$/,'');
  const key=q.get('key')||cfg.supabaseAnonKey||'';
  const box=document.getElementById('content');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!(short||id)||!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(project)||!key){
    box.innerHTML='<p class="error">Lien incomplet ou configuration publique absente. Le propriétaire doit renseigner src/public-config.js, publier GitHub Pages et republier cette étiquette.</p>';return;
  }
  const filter=short?'public_code=eq.'+encodeURIComponent(short):'id=eq.'+encodeURIComponent(id);
  fetch(project+'/rest/v1/caverne_public_labels?'+filter+'&select=tag,item_name,owner_name,organization,phone,email',{headers:{apikey:key,Accept:'application/json'}})
    .then(async r=>{if(!r.ok)throw Error('Fiche indisponible');return r.json()})
    .then(rows=>{
      const x=rows[0];if(!x)throw Error('Cette étiquette n’est pas publiée ou n’existe plus.');
      box.innerHTML=`<div class="eyebrow">IDENTIFIANT DU MATÉRIEL</div><div class="tag">${esc(x.tag)}</div><h1 class="item">${esc(x.item_name)}</h1><section class="owner"><div class="eyebrow">PROPRIÉTAIRE</div><h2>${esc(x.owner_name||'Propriétaire non renseigné')}</h2><p class="muted">${esc(x.organization||'')}</p><div class="contact">${x.phone?`<a href="tel:${encodeURIComponent(x.phone)}">Appeler le propriétaire</a>`:''}${x.email?`<a class="secondary" href="mailto:${encodeURIComponent(x.email)}">Envoyer un e-mail</a>`:''}${!x.phone&&!x.email?'<p class="muted">Aucun moyen de contact public n’a été renseigné.</p>':''}</div></section>`;
    })
    .catch(e=>{box.innerHTML='<p class="error">'+esc(e.message)+'</p><p class="muted">Vérifie ta connexion Internet ou demande au propriétaire de republier cette étiquette.</p>';});
})();
</script></body></html>
