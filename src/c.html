<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body style="background:#171a1d;color:#f4f4f4;font-family:Arial,sans-serif;padding:24px">
<!-- Adresse courte pour les QR anti-perte : c.html?CODE → contact.html?i=CODE (moins de modules = QR plus gros et plus lisible). -->
<p id="m">Ouverture de la fiche…</p><noscript><p><a style="color:#d9a441" href="contact.html">Ouvrir la fiche</a></p></noscript>
<script>
(()=>{const s=location.search.replace(/^\?/,'');const code=/^[A-Za-z0-9]{8}$/.test(s)?s.toUpperCase():'';
location.replace(code?'contact.html?i='+code:'contact.html'+location.search);})();
</script></body></html>
