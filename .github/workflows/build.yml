name: Compiler l'app Mac et Windows

on:
  push:
    tags: ["v*"]          # ex. : git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # ou bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write          # nécessaire pour créer la Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Mac
            command: npm run dist:mac
          - os: windows-latest
            name: Windows
            command: npm run dist:win
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # pas de signature Apple (pas de certificat)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Garder les installateurs (téléchargeables dans l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: La-caverne-dAlibaab-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

      - name: Publier dans la Release GitHub (uniquement sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
